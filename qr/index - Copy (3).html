<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled QR Code Generator</title>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 460px;
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: -6px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }

        .btn-secondary {
            background-color: #0f172a;
            margin-top: 16px;
        }

        .btn-secondary:hover { background-color: #1e293b; }

        /* QR Code Display Wrapper */
        #qrcode-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 24px;
            padding: 24px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .qr-wrapper {
            position: relative;
            display: inline-block;
        }

        #qrcode canvas, #qrcode img {
            border-radius: 8px;
            display: block;
        }

        /* ASL Center Logo */
        .asl-overlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 52px;
            height: 52px;
            background: white;
            border-radius: 50%;
            border: 3px solid #e11d48;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        #qr-text {
            margin-top: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            word-break: break-word;
        }

        /* Theme Styles */
        .theme-classic {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: #0f172a;
        }

        .theme-dark {
            background: #0f172a;
            border: 1px solid #1e293b;
            color: #f8fafc;
        }

        .theme-neon {
            background: #090d16;
            border: 2px solid #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            color: #00f2fe;
        }

        .theme-asl-love {
            background: #fff1f2;
            border: 2px solid #fda4af;
            color: #e11d48;
        }
    </style>
</head>

<body>

    <main class="card">
        <h1>QR Code Generator</h1>

        <div class="input-group">
            <label for="url">Target URL</label>
            <input type="text" id="url" placeholder="https://example.com" required>
        </div>

        <div class="input-group">
            <label for="caption">Caption (Optional)</label>
            <input type="text" id="caption" placeholder="Enter text below QR">
        </div>

        <div class="input-group">
            <label for="design-style">Choose Design Theme</label>
            <select id="design-style">
                <option value="classic">Classic Minimal (Black & White)</option>
                <option value="asl-love">🤟 ASL "I Love You" Theme</option>
                <option value="dark">Midnight Dark</option>
                <option value="neon">Neon Cyan</option>
            </select>
        </div>

        <button class="btn" onclick="generateQR()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            Generate QR Code
        </button>

        <div id="qrcode-container">
            <div class="qr-wrapper">
                <div id="qrcode"></div>
                <div id="asl-icon" class="asl-overlay">🤟</div>
            </div>
            <div id="qr-text"></div>
        </div>

        <button id="downloadBtn" class="btn btn-secondary" style="display: none;" onclick="downloadQR()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download QR Code
        </button>
    </main>

    <script>
        const themes = {
            'classic': { dark: '#000000', light: '#ffffff', class: 'theme-classic' },
            'asl-love': { dark: '#e11d48', light: '#ffffff', class: 'theme-asl-love' },
            'dark': { dark: '#ffffff', light: '#0f172a', class: 'theme-dark' },
            'neon': { dark: '#00f2fe', light: '#090d16', class: 'theme-neon' }
        };

        function generateQR() {
            const url = document.getElementById("url").value.trim();
            const caption = document.getElementById("caption").value.trim();
            const selectedStyle = document.getElementById("design-style").value;
            
            const qrContainer = document.getElementById("qrcode");
            const containerWrapper = document.getElementById("qrcode-container");
            const downloadBtn = document.getElementById("downloadBtn");
            const aslOverlay = document.getElementById("asl-icon");

            if (!url) {
                alert("Please enter a valid URL.");
                return;
            }

            // Clear previous output
            qrContainer.innerHTML = "";
            document.getElementById("qr-text").textContent = caption;

            // Apply selected theme class
            containerWrapper.className = themes[selectedStyle].class;

            // Render ASL icon overlay if ASL theme selected
            if (selectedStyle === 'asl-love') {
                aslOverlay.style.display = 'flex';
            } else {
                aslOverlay.style.display = 'none';
            }

            // Generate QR with High Error Correction (allows overlaying center icon)
            new QRCode(qrContainer, {
                text: url,
                width: 240,
                height: 240,
                colorDark: themes[selectedStyle].dark,
                colorLight: themes[selectedStyle].light,
                correctLevel: QRCode.CorrectLevel.H
            });

            containerWrapper.style.display = "flex";
            downloadBtn.style.display = "inline-flex";
        }

        function downloadQR() {
            const container = document.getElementById("qrcode-container");

            html2canvas(container, { scale: 2 }).then(canvas => {
                const link = document.createElement("a");
                link.href = canvas.toDataURL("image/png");
                link.download = "styled_qrcode.png";
                link.click();
            });
        }
    </script>

</body>

</html>
