<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #0f172a;
            margin-top: 16px;
        }

        .btn-secondary:hover {
            background-color: #1e293b;
        }

        #qrcode-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 24px;
            padding: 20px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        #qrcode canvas,
        #qrcode img {
            border-radius: 4px;
            max-width: 100%;
            height: auto;
        }

        #qr-text {
            margin-top: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            word-break: break-word;
        }
    </style>
</head>

<body>

    <main class="card">
        <h1>QR Code Generator</h1>

        <div class="input-group">
            <input type="text" id="url" placeholder="Enter URL (e.g., https://example.com)" required>
            <input type="text" id="caption" placeholder="Enter text below QR (optional)">
        </div>

        <button class="btn" onclick="generateQR()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            Generate QR Code
        </button>

        <div id="qrcode-container">
            <div id="qrcode"></div>
            <div id="qr-text"></div>
        </div>

        <button id="downloadBtn" class="btn btn-secondary" style="display: none;" onclick="downloadQR()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download QR Code
        </button>
    </main>

    <script>
        // Trigger QR generation when pressing Enter in inputs
        document.querySelectorAll("input").forEach(input => {
            input.addEventListener("keypress", function (event) {
                if (event.key === "Enter") {
                    generateQR();
                }
            });
        });

        function generateQR() {
            const url = document.getElementById("url").value.trim();
            const caption = document.getElementById("caption").value.trim();
            const qrContainer = document.getElementById("qrcode");
            const qrWrapper = document.getElementById("qrcode-container");
            const downloadBtn = document.getElementById("downloadBtn");

            if (!url) {
                alert("Please enter a valid URL.");
                return;
            }

            qrContainer.innerHTML = "";
            document.getElementById("qr-text").textContent = caption;

            new QRCode(qrContainer, {
                text: url,
                width: 250,
                height: 250,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            qrWrapper.style.display = "flex";
            downloadBtn.style.display = "inline-flex";
        }

        function downloadQR() {
            const container = document.getElementById("qrcode-container");

            html2canvas(container, { backgroundColor: "#ffffff", scale: 2 }).then(canvas => {
                const link = document.createElement("a");
                link.href = canvas.toDataURL("image/png");
                link.download = "qrcode.png";
                link.click();
            });
        }
    </script>

</body>

</html>
